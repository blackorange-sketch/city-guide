name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build signed release APK
        run: gradle assembleRelease -PbuildNumber=${{ github.run_number }} -PproxyUrl="${{ vars.PROXY_URL }}" -PproxyKey="${{ secrets.PROXY_KEY }}" --no-daemon

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk CityGuide.apk

      - uses: actions/upload-artifact@v4
        with:
          name: city-guide-apk
          path: CityGuide.apk

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Путівник v0.1.${{ github.run_number }}
          make_latest: true
          generate_release_notes: true
          files: CityGuide.apk
